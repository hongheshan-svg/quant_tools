name: Daily analysis

# 收盘后在 GitHub Actions 上执行一遍：数据采集 → 综合分析 → 交易信号 → 大盘复盘与日报推送 → 自学习 → 自选股仪表盘。
#
# 启用：仓库 Settings → Secrets and variables → Actions
#   Variables：ENABLE_DAILY_ANALYSIS=true（没有它时定时任务不运行，手动运行不受影响）
#   配置二选一（可以同时用，单独的 Secret 优先）：
#     Secret SETTINGS_YAML：完整的 config/settings.yaml 内容
#     单独的 Secret / Variable，映射见下方 env（QUANT__ 开头的环境变量会覆盖配置）
#   推送渠道（配置了对应 Secret / Variable 的渠道自动启用，没配的不影响）：
#     Telegram：Secret TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID
#     Discord：Secret DISCORD_WEBHOOK；Slack：Secret SLACK_WEBHOOK
#     PushPlus：Secret PUSHPLUS_TOKEN，Variable PUSHPLUS_TOPIC（群组编码，可空）
#     Server酱：Secret SERVERCHAN_SENDKEY
#     ntfy：Secret NTFY_TOPIC、NTFY_TOKEN（可空），Variable NTFY_SERVER（自建服务器，可空）
#     Gotify：Secret GOTIFY_TOKEN，Variable GOTIFY_SERVER
#     Pushover：Secret PUSHOVER_USER_KEY、PUSHOVER_API_TOKEN
#     Bark：Secret BARK_DEVICE_KEY，Variable BARK_SERVER（自建服务器，可空）
#     自定义 Webhook：Secret CUSTOM_WEBHOOK_URL
#   联网搜索（任一配置即启用，多个 Key 用逗号分隔）：
#     Secret BOCHA_API_KEYS、TAVILY_API_KEYS、SERPAPI_API_KEYS、BRAVE_API_KEYS、ANSPIRE_API_KEYS、MINIMAX_API_KEYS；Variable SEARXNG_BASE_URLS
# 手动运行（workflow_dispatch）可以填 stocks 只诊断指定股票并推送，或勾选 no_notify 不推送。
# 数据库通过 actions/cache 保留到下一次运行。GitHub 的服务器在境外，部分国内数据源可能访问失败或变慢。

on:
  schedule:
    - cron: "40 8 * * 1-5"   # 北京时间 16:40（周一至周五；节假日由程序按交易日历跳过）
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run, comma-separated; empty runs all: collect,analysis,signals,report,learn,watchlist"
        required: false
        default: ""
      stocks:
        description: "Only diagnose these stocks and push the dashboard, comma-separated (code, name or pinyin initials); overrides steps"
        required: false
        default: ""
      no_notify:
        description: "Do not send any notifications"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run daily analysis
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_ANALYSIS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      # 大模型
      QUANT__LLM__PRIMARY__PROVIDER: ${{ vars.LLM_PROVIDER }}
      QUANT__LLM__PRIMARY__BASE_URL: ${{ vars.LLM_BASE_URL }}
      QUANT__LLM__PRIMARY__MODEL: ${{ vars.LLM_MODEL }}
      QUANT__LLM__PRIMARY__API_KEY: ${{ secrets.LLM_API_KEY }}
      QUANT__LLM__BACKUP__PROVIDER: ${{ vars.LLM_BACKUP_PROVIDER }}
      QUANT__LLM__BACKUP__BASE_URL: ${{ vars.LLM_BACKUP_BASE_URL }}
      QUANT__LLM__BACKUP__MODEL: ${{ vars.LLM_BACKUP_MODEL }}
      QUANT__LLM__BACKUP__API_KEY: ${{ secrets.LLM_BACKUP_API_KEY }}
      # 推送（配置了 Webhook 的渠道自动启用）
      QUANT__NOTIFIER__WECHAT__ENABLED: ${{ secrets.WECHAT_WEBHOOK != '' && 'true' || '' }}
      QUANT__NOTIFIER__WECHAT__WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK }}
      QUANT__NOTIFIER__DINGTALK__ENABLED: ${{ secrets.DINGTALK_WEBHOOK != '' && 'true' || '' }}
      QUANT__NOTIFIER__DINGTALK__WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK }}
      QUANT__NOTIFIER__DINGTALK__SECRET: ${{ secrets.DINGTALK_SECRET }}
      QUANT__NOTIFIER__FEISHU__ENABLED: ${{ secrets.FEISHU_WEBHOOK != '' && 'true' || '' }}
      QUANT__NOTIFIER__FEISHU__WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
      QUANT__NOTIFIER__FEISHU__SECRET: ${{ secrets.FEISHU_SECRET }}
      QUANT__NOTIFIER__EMAIL__PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      # 推送新渠道
      QUANT__NOTIFIER__TELEGRAM__ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'true' || '' }}
      QUANT__NOTIFIER__TELEGRAM__BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      QUANT__NOTIFIER__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      QUANT__NOTIFIER__DISCORD__ENABLED: ${{ secrets.DISCORD_WEBHOOK != '' && 'true' || '' }}
      QUANT__NOTIFIER__DISCORD__WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
      QUANT__NOTIFIER__SLACK__ENABLED: ${{ secrets.SLACK_WEBHOOK != '' && 'true' || '' }}
      QUANT__NOTIFIER__SLACK__WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      QUANT__NOTIFIER__PUSHPLUS__ENABLED: ${{ secrets.PUSHPLUS_TOKEN != '' && 'true' || '' }}
      QUANT__NOTIFIER__PUSHPLUS__TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      QUANT__NOTIFIER__PUSHPLUS__TOPIC: ${{ vars.PUSHPLUS_TOPIC }}
      QUANT__NOTIFIER__SERVERCHAN__ENABLED: ${{ secrets.SERVERCHAN_SENDKEY != '' && 'true' || '' }}
      QUANT__NOTIFIER__SERVERCHAN__SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      QUANT__NOTIFIER__NTFY__ENABLED: ${{ secrets.NTFY_TOPIC != '' && 'true' || '' }}
      QUANT__NOTIFIER__NTFY__TOPIC: ${{ secrets.NTFY_TOPIC }}
      QUANT__NOTIFIER__NTFY__SERVER: ${{ vars.NTFY_SERVER }}
      QUANT__NOTIFIER__NTFY__TOKEN: ${{ secrets.NTFY_TOKEN }}
      QUANT__NOTIFIER__GOTIFY__ENABLED: ${{ secrets.GOTIFY_TOKEN != '' && 'true' || '' }}
      QUANT__NOTIFIER__GOTIFY__SERVER: ${{ vars.GOTIFY_SERVER }}
      QUANT__NOTIFIER__GOTIFY__TOKEN: ${{ secrets.GOTIFY_TOKEN }}
      QUANT__NOTIFIER__PUSHOVER__ENABLED: ${{ secrets.PUSHOVER_USER_KEY != '' && 'true' || '' }}
      QUANT__NOTIFIER__PUSHOVER__USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      QUANT__NOTIFIER__PUSHOVER__API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      QUANT__NOTIFIER__BARK__ENABLED: ${{ secrets.BARK_DEVICE_KEY != '' && 'true' || '' }}
      QUANT__NOTIFIER__BARK__DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      QUANT__NOTIFIER__BARK__SERVER: ${{ vars.BARK_SERVER }}
      QUANT__NOTIFIER__WEBHOOK__ENABLED: ${{ secrets.CUSTOM_WEBHOOK_URL != '' && 'true' || '' }}
      QUANT__NOTIFIER__WEBHOOK__URL: ${{ secrets.CUSTOM_WEBHOOK_URL }}
      # 联网搜索（任一搜索服务配置了就启用）
      QUANT__SEARCH__ENABLED: ${{ (secrets.BOCHA_API_KEYS != '' || secrets.TAVILY_API_KEYS != '' || secrets.SERPAPI_API_KEYS != '' || secrets.BRAVE_API_KEYS != '' || secrets.ANSPIRE_API_KEYS != '' || secrets.MINIMAX_API_KEYS != '' || vars.SEARXNG_BASE_URLS != '') && 'true' || '' }}
      QUANT__SEARCH__BOCHA__API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
      QUANT__SEARCH__TAVILY__API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
      QUANT__SEARCH__SERPAPI__API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
      QUANT__SEARCH__BRAVE__API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
      QUANT__SEARCH__ANSPIRE__API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
      QUANT__SEARCH__MINIMAX__API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
      QUANT__SEARCH__SEARXNG__BASE_URLS: ${{ vars.SEARXNG_BASE_URLS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          grep -viE '^pyinstaller' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          playwright install --with-deps chromium

      - name: Write settings.yaml
        env:
          SETTINGS_YAML: ${{ secrets.SETTINGS_YAML }}
        run: |
          if [ -n "$SETTINGS_YAML" ]; then
            printf '%s\n' "$SETTINGS_YAML" > config/settings.yaml
            echo "Wrote config/settings.yaml from SETTINGS_YAML"
          else
            echo "No SETTINGS_YAML; using default settings and QUANT__ environment variables"
          fi

      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data
          key: quant-data-${{ github.run_id }}
          restore-keys: quant-data-

      - name: Run pipeline
        env:
          STEPS: ${{ inputs.steps }}
          STOCKS: ${{ inputs.stocks }}
          NO_NOTIFY: ${{ inputs.no_notify && 'true' || '' }}
        run: |
          args=()
          [ -n "$NO_NOTIFY" ] && args+=(--no-notify)
          if [ -n "$STOCKS" ]; then
            python main.py --stocks "$STOCKS" "${args[@]}"
          elif [ -n "$STEPS" ]; then
            python main.py --once --steps "$STEPS" "${args[@]}"
          else
            python main.py --once "${args[@]}"
          fi

      - name: Save database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: quant-data-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-analysis-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
