name: CI

# 推送 main、提交 PR 时运行；发布工作流（release.yml）打标签时先调用它，测试不过不发布。
# 只改文档时不运行；同一分支 / PR 有新提交时取消还在跑的旧任务。

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/release-notes/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/release-notes/**"]
  workflow_call:
  workflow_dispatch:

# 被 release.yml 调用时 github.workflow 是调用方的名称，分组不同，不会和推送 main 触发的 CI 互相取消
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_changes.py

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 测试不打包，跳过 PyInstaller
      - name: Install dependencies
        run: |
          grep -viE '^pyinstaller' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt pytest

      # 测试不访问网络，也不需要 Playwright 浏览器
      - name: Run tests
        run: python scripts/pytest_shard.py --index ${{ matrix.shard }} --count 3

      - name: Run script-style tests
        if: matrix.shard == 0
        run: |
          python tests/test_basic.py
          python tests/test_self_learning.py

      - name: Python syntax and critical lint
        if: matrix.shard == 0
        run: |
          python -m compileall -q src api scripts main.py server.py
          pip install ruff==0.16.10
          ruff check --select E9,F63,F7,F82 src api scripts main.py server.py
          python scripts/check_alignment_assets.py

  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: |
          grep -viE '^pyinstaller' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          playwright install --with-deps chromium
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/web_e2e.py --output /tmp/quant-web-e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: /tmp/quant-web-e2e

  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t quant-ci .
      - run: |
          docker run -d --name quant-ci -p 127.0.0.1:8000:8000 -e QUANT__WEB__API_TOKEN=quant-ci-smoke -e QUANT_NO_NOTIFY=1 quant-ci python server.py --host 0.0.0.0 --no-scheduler
          QUANT_SMOKE_API_TOKEN=quant-ci-smoke python scripts/check_alignment_assets.py --url http://127.0.0.1:8000 --wait 120
      - if: always()
        run: docker logs quant-ci; docker rm -f quant-ci

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 测试替换了 electron 模块，不需要安装 Electron
      - name: Test
        working-directory: apps/desktop
        run: npm test
