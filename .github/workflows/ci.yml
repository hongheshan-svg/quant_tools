name: CI

# 推送 main、提交 PR 时运行；发布工作流（release.yml）打标签时先调用它，测试不过不发布。
# 只改文档时不运行；同一分支 / PR 有新提交时取消还在跑的旧任务。

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/release-notes/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/release-notes/**"]
  workflow_call:
  workflow_dispatch:

# 被 release.yml 调用时 github.workflow 是调用方的名称，分组不同，不会和推送 main 触发的 CI 互相取消
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 测试不导入 PyQt6（CI 机器也没有 libEGL）、不打包，跳过这两个大包
      - name: Install dependencies
        run: |
          grep -viE '^(pyqt6|pyinstaller)' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt pytest

      # 测试不访问网络，也不需要 Playwright 浏览器
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider tests/

      - name: Run script-style tests
        run: |
          python tests/test_basic.py
          python tests/test_self_learning.py

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 测试替换了 electron 模块，不需要安装 Electron
      - name: Test
        working-directory: apps/desktop
        run: npm test
