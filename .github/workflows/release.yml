name: Release

# 推送 v* 标签时发布：先跑 CI（ci.yml），通过后并行打包桌面端（Windows / macOS / Linux）和 Docker 镜像，最后创建 GitHub Release。
# - 桌面端：scripts/build_desktop.py 打包，scripts/smoke_backend.py 启动打包的后台服务做冒烟测试，缺文件、缺隐藏导入时失败。
#   Linux 在 ubuntu-22.04 上打包：PyInstaller 产物依赖构建机的 glibc，用较旧的系统打包能在更多发行版上运行。
#   自动更新（electron-updater）依赖 Release 里的 latest.yml、latest-mac.yml、latest-linux.yml 和 .blockmap，缺失则客户端检查不到更新
#   （不上传 builder-debug.yml：各系统同名，合并时会互相覆盖）。
# - Docker：amd64、arm64 分别在原生 runner 上构建（不用 QEMU 模拟），按 digest 推送后合并成多架构镜像，
#   标签为版本号、主.次版本、latest 和 sha，发布到 ghcr.io/<owner>/<repo>。
# - 发布说明（中文）：scripts/release_notes.py 生成，版本亮点取自 .github/release-notes/<tag>.md，末尾附与上一个版本对比的完整变更记录链接。
# 手动运行（workflow_dispatch）是演练：桌面端打包后上传为构建产物，Docker 只构建不推送，不创建 Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"   # Windows 控制台默认不是 UTF-8，脚本输出中文会报错
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build desktop app
        run: python scripts/build_desktop.py

      - name: Smoke test packaged backend
        run: python scripts/smoke_backend.py

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker (${{ matrix.arch }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker (multi-arch manifest)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, docker-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 拉取全部历史和标签，发布说明要用 git describe 找上一个版本标签
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: desktop-*
          merge-multiple: true

      - name: Write release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" -o release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
