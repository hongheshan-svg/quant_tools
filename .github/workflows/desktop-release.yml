name: 桌面端发布

# 推送 v* 标签时打包 Windows 安装包、macOS dmg 和 Linux AppImage（scripts/build_desktop.py），上传到对应的 GitHub Release。
# 每个平台打包后先运行 scripts/smoke_backend.py 启动打包的后台服务做冒烟测试，缺文件、缺隐藏导入时构建失败。
# Linux 在 ubuntu-22.04 上打包：PyInstaller 产物依赖构建机的 glibc，用较旧的系统打包能在更多发行版上运行。
# 自动更新（electron-updater）依赖 Release 里的 latest.yml（Windows）、latest-mac.yml、latest-linux.yml 和 .blockmap，
# 因此构建产物与 Release 都要包含 apps/desktop/dist 下的 latest*.yml、*.blockmap（不含 builder-debug.yml：两个系统同名，合并时会互相覆盖），缺失则客户端检查不到更新。
# 手动运行时只上传为构建产物，不创建 Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"   # Windows 控制台默认不是 UTF-8，脚本输出中文会报错
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 设置版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 打包
        run: python scripts/build_desktop.py

      - name: 后台服务冒烟测试
        run: python scripts/smoke_backend.py

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows 10/11（x64） | `AStockQuant-*-windows-setup.exe` | 运行安装程序；SmartScreen 提示「已保护你的电脑」时点「更多信息 → 仍要运行」 |
            | macOS（Apple 芯片） | `AStockQuant-*-macos-arm64.dmg` | 打开后把 AStockQuant 拖进「应用程序」。应用没有 Apple 公证，首次打开被拦截时到「系统设置 → 隐私与安全性」点「仍要打开」，或在终端执行 `xattr -cr /Applications/AStockQuant.app` |
            | Linux（x64，glibc 2.35+，如 Ubuntu 22.04+） | `AStockQuant-*-linux-x86_64.AppImage` | `chmod +x AStockQuant-*.AppImage` 后直接运行；系统需要 FUSE 2（Ubuntu：`sudo apt install libfuse2`，24.04 起为 `libfuse2t64`） |

            首次启动会在后台下载采集用的 Chromium（约 150 MB），按向导在【设置 → AI 模型】填写大模型 API Key 后即可使用 AI 功能。
            数据目录：Windows `%APPDATA%\quant-tools-desktop`，macOS `~/Library/Application Support/quant-tools-desktop`，Linux `~/.config/quant-tools-desktop`。
