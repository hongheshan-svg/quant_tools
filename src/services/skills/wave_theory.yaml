name: wave_theory
display_name: 波浪理论
description: 用艾略特波浪和斐波那契回撤判断趋势所处的浪型位置。
category: framework
aliases: [波浪, 艾略特, elliott]
market_regimes: []
priority: 85
instructions: |
  按波浪理论分析（daily_bars 取最多 60 根日线，technical 辅助确认动量）：
  - 浪型：判断当前处于推动浪（1-2-3-4-5）还是调整浪（A-B-C），标出关键高低点。
  - 规则检验：第 2 浪不跌破第 1 浪起点；第 3 浪通常最长且量能最大；第 4 浪不与第 1 浪重叠。规则被破坏就重新数浪。
  - 位置与目标：用斐波那契回撤（0.382/0.5/0.618）估计调整浪支撑；第 3 浪目标可取第 1 浪的 1.618 倍延伸。
  - 入场/出场：第 2 或第 4 浪回撤到位企稳时介入；第 5 浪末端（量价背离）和 C 浪未完成时回避；
    止损设在浪型失效位（如第 1 浪起点）。
  - 对结论的影响：数浪存在多种解释，必须说明备选方案；处于第 3 浪主升给积极结论，第 5 浪末端或 C 浪下跌给谨慎，
    并提示波浪理论主观性较强，以量价和止损为准。
