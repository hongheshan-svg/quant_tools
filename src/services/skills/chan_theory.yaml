name: chan_theory
display_name: 缠论
description: 用笔、线段、中枢和背驰判断买卖点（一买、二买、三买）。
category: framework
aliases: [中枢, 三买, chan, 缠中说禅]
market_regimes: []
priority: 80
instructions: |
  按缠论的框架分析（基于日线，daily_bars 取最多 60 根；技术指标用 technical 辅助）：
  - 结构：识别近期的笔、线段和中枢（至少三笔重叠的区间），说明当前处于中枢内、中枢上方还是下方，
    并给出中枢的大致区间（ZG/ZD）。
  - 买点：一买 = 下跌趋势末端背驰（价格新低而 MACD 面积/力度减弱）；二买 = 一买后回抽不创新低；
    三买 = 突破中枢后回踩不进中枢。卖点与之对称。
  - 入场/出场：二买、三买回踩确认时入场；止损设在中枢边缘或笔的低点；出现顶背驰或跌回中枢内时减仓。
  - 说明：数据只有日线级别时，明确只能判断日线级别的结构，无法验证更小级别的区间套。
  - 对结论的影响：有清晰买点且背驰/回踩确认时才看多；结构模糊（震荡在中枢里）时给观望；
    需列出判断依据和关键价位，并提示缠论主观性较强。
instructions_en: |
  Apply Chan analysis to at most 60 daily bars with technical confirmation. Identify strokes, segments and a central overlap zone involving at least three strokes; state its approximate ZG/ZD bounds and whether price is inside, above or below it.
  The first buy is bearish-trend exhaustion with a price low but weaker MACD area/strength; the second is a retest without a new low; the third is a breakout retest holding above the central zone. Sell points are symmetric.
  Enter confirmed second/third buys; stop at the central-zone edge or stroke low; reduce on top divergence or a return inside the zone. Daily data cannot validate smaller-timeframe nesting. Only clear, confirmed setups support a bullish view; otherwise watch and disclose subjectivity.
