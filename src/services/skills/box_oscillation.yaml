name: box_oscillation
display_name: 箱体震荡
description: 股价在明确的上下沿之间震荡，低吸高抛并等待突破方向。
category: pattern
aliases: [箱体, 区间震荡, 横盘]
market_regimes: [均衡, 防守]
priority: 55
instructions: |
  按箱体震荡的标准判断：
  - 判断标准：daily_bars 取 30~60 日，确认存在至少两次触及上沿和下沿的箱体，给出上沿、下沿价位和振幅（振幅需大于 10% 才有操作价值）；
    technical 看 RSI、量能：箱体内下沿缩量、上沿放量为常态。
  - 入场条件：靠近下沿缩量企稳低吸，或放量有效突破上沿（收盘站稳 + 量比 ≥ 1.5）后追入。
  - 出场条件：接近上沿分批兑现；止损：收盘跌破下沿 -3% 视为箱体失效，无条件离场。
  - 回避：箱体不清晰、价格在箱体中部（盈亏比差）、大盘冰点导致向下破位概率高。
  - 对结论的影响：中部给观望；下沿给低吸并给出止损；说明当前在箱体中的相对位置和盈亏比。
