name: bull_trend
display_name: 多头趋势
description: 均线多头排列的上升趋势，顺势持有，回踩加仓。
category: trend
aliases: [多头, 趋势, 多头排列, 趋势跟踪]
market_regimes: [进攻, 均衡]
priority: 35
instructions: |
  按多头趋势跟踪的标准判断：
  - 判断标准：technical 确认 MA5>MA10>MA20>MA60 且均线向上，价格沿 MA10/MA20 上行；daily_bars 看高低点逐步抬高；
    MACD 在零轴上方；量能温和放大。乖离率过大（偏离 MA20 超 15%~20%）说明短线过热，不追高。
  - 入场条件：回踩 MA10/MA20 不破时介入，或突破前高放量时跟进；fund_flow 主力持续净流入加分。
  - 出场条件：收盘跌破 MA20 减仓，跌破 MA60 或均线拐头向下离场；止损：买点下方 MA20 -2%。
  - 回避：均线纠缠（趋势不明）、放量滞涨的高位、公告有严重风险、大盘冰点。
  - 对结论的影响：趋势结构完整给看多并给出持有/加仓/止盈的规则；已过热的降级为持有观望，不建议追涨。
