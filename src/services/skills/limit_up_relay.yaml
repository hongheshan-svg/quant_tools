name: limit_up_relay
display_name: 打板接力
description: 看封板质量、连板高度、晋级率和主线地位，判断次日接力溢价。
category: emotion
aliases: [接力, 连板接力, 打板]
market_regimes: [进攻, 均衡]
priority: 10
instructions: |
  按打板接力的标准判断：
  - 判断标准：limit_up_history 看连板数、封板时间（早盘 10:00 前封板为强）、炸板次数（0~1 次为佳）、是否一字/换手板；
    theme 看所属主线是否处于启动/加速阶段、该股是龙头还是跟风；market 看大盘环境和涨停家数、昨日涨停股今日表现（溢价）。
  - 入场条件：主线在、封板强、板块有梯队（同板块至少 3 只涨停）、大盘环境为进攻或均衡；优先首板放量换手和二板接力，
    3 板以上只做板块绝对龙头。
  - 出场条件：次日不能高开或冲高回落、封板失败、板块龙头断板时兑现；
    止损：接力买入后次日跌破买入价 -3%~-5% 离场。
  - 回避：高位分歧加大、连板股大面积亏钱、冰点/防守环境、纯一字无法买入、公告有减持或立案风险。
  - 对结论的影响：主线龙头 + 强封板 + 环境配合才可给看多；缺任一项降为观望；环境不匹配时必须明确提示风险。
