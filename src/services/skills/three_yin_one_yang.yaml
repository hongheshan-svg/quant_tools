name: three_yin_one_yang
display_name: 一阳穿三阴
description: 连续三根阴线后一根大阳线吞没，捕捉短线洗盘结束的转强信号。
category: pattern
aliases: [阳包阴, 一阳穿阴, 一阳穿三阴线]
market_regimes: [进攻, 均衡]
priority: 62
instructions: |
  按一阳穿三阴的标准判断：
  - 判断标准：daily_bars 确认最近出现连续 3 根（或以上）阴线后，一根阳线收盘价高于前三根阴线的最高价（或至少吞没其大部分实体）；
    technical 看该阳线是否放量（量比 ≥ 1.5）、是否站上 MA5/MA10；阴线阶段缩量、阳线放量为佳（洗盘特征）。
  - 入场条件：阳线次日不破阳线实体一半时介入，或阳线收盘直接跟进；结合 theme 看是否属于活跃题材。
  - 出场条件：再次放量阴线跌破阳线低点离场；止损：阳线低点下方 -1%~-2%，止损位清晰。
  - 回避：出现在下降趋势中（MA20、MA60 向下，只是反抽）、阳线无量、高位出现（可能是诱多）、大盘冰点。
  - 对结论的影响：形态 + 放量 + 趋势不坏才看多；只有形态无量能确认给观望。
