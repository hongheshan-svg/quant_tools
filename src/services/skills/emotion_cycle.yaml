name: emotion_cycle
display_name: 情绪周期
description: 按冰点、修复、发酵、高潮、退潮判断市场情绪阶段，决定进攻或防守。
category: emotion
aliases: [情绪, 赚钱效应, 周期]
market_regimes: []
priority: 12
instructions: |
  按短线情绪周期的框架判断，先定位周期再谈个股：
  - 周期阶段：冰点（涨停少、跌停多、连板高度低）→ 修复（首板增多、亏钱效应缓解）→ 发酵（连板高度抬升、板块效应强）
    → 高潮（普涨、高位加速、一致性强）→ 退潮（高标断板、炸板率上升、亏钱效应扩散）。
  - 工具：market 取量化大盘环境、涨跌家数、涨停和主线；theme 看主线梯队与阶段；limit_up_history 看该股在周期中的位置。
  - 操作：冰点末期和修复初期可试错做龙头首板；发酵期做主线龙头和补涨；高潮期只持有不追高；
    退潮期空仓或极轻仓，不接力高位股。
  - 对结论的影响：周期在退潮/冰点时，个股再强也只给观望或看空；周期在修复/发酵时才给积极结论，
    并指出当前阶段和判断依据；数据不足以判断周期时明说。
instructions_en: |
  Identify the short-term sentiment stage before analyzing the stock: frozen (few limit-ups, many limit-downs, low streak height), repair (more first limits, less loss), expansion (higher streaks, stronger sector effects), climax (broad gains, crowded high-level acceleration), retreat (leaders break, reopened limits rise, losses spread).
  Use market breadth, limit-ups, theme ladders/stages and the stock's limit-up history. Late frozen/early repair permits small leader trials; expansion favors leaders and catch-up stocks; climax favors holding without chasing; retreat requires cash or very light allocation, with no high-level relay.
  Frozen/retreat caps even a strong stock at watch or bearish. Positive conclusions require repair/expansion evidence. State the stage and evidence, or explicitly acknowledge insufficient data.
