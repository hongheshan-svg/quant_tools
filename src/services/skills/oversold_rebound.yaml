name: oversold_rebound
display_name: 超跌反弹
description: 连续大跌后放量企稳的博弈反弹，严格止损。
category: reversal
aliases: [超跌, 反弹, 错杀反弹]
market_regimes: [均衡, 防守]
priority: 60
instructions: |
  按超跌反弹的标准判断：
  - 判断标准：daily_bars 看前期跌幅（10 日跌幅超过 20% 或 RSI6 < 20）；technical 看是否放量企稳、乖离率大幅为负；
    news、earnings 确认没有利空未出尽（业绩预亏、立案、减持、退市风险）；chips 看套牢盘是否集中。
  - 入场条件：出现放量长下影、阳包阴等企稳信号后小仓位介入；fund_flow 主力止跌回流更佳。
  - 出场条件：反弹到 MA10/MA20 或前期下跌平台分批兑现，博弈性质不宜久持；止损：跌破企稳低点 -4%~-5%。
  - 回避：基本面恶化导致的下跌（不是错杀）、下跌趋势中无量反抽、大盘冰点持续杀跌。
  - 对结论的影响：只能给「博弈」性质的结论，仓位建议不超过轻仓；有严重公告风险直接看空。
instructions_en: |
  Seek a decline above 20% over 10 days or RSI6 below 20, strongly negative price deviation and high-volume stabilization. Verify earnings/news for unresolved loss guidance, investigations, shareholder reductions or delisting risk; assess trapped chips.
  Enter only a small speculative position after a long lower wick, bullish engulfing or similar confirmed stabilization; returning major inflows help. Take profits in batches at MA10/MA20 or the former breakdown platform; do not treat the rebound as a long hold. Stop 4%-5% below the stabilization low.
  Avoid fundamentally justified declines, low-volume bounces in a downtrend and persistent frozen-market selling. Clearly label the trade speculative and light; severe announcement risk means bearish.
