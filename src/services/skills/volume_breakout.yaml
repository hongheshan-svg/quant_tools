name: volume_breakout
display_name: 放量突破
description: 放量突破平台或前高，量价配合确认强势。
category: pattern
aliases: [突破, 平台突破, 放量突破前高]
market_regimes: [进攻, 均衡]
priority: 40
instructions: |
  按放量突破的标准判断：
  - 判断标准：daily_bars 看是否突破近 20 日平台或前高；technical 看量比 ≥ 2 倍、收盘接近最高价、
    均线多头或即将多头；乖离率不宜过大（偏离 MA20 超过 15% 追高风险大）。
  - 入场条件：突破当日或回踩确认（不破突破位）时介入；fund_flow 主力净流入、theme 有题材共振更佳。
  - 出场条件：放量滞涨或跌回平台内；止损：跌破突破位（平台上沿）-3%~-5%，收盘跌回平台视为假突破。
  - 回避：缩量突破、突破后长上影、大盘冰点或防守、公告有减持。
  - 对结论的影响：量能与收盘强度是核心，缩量或长上影降为观望。
