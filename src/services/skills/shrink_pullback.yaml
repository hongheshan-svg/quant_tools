name: shrink_pullback
display_name: 缩量回踩
description: 上升趋势中缩量回踩均线，低风险的趋势买点。
category: trend
aliases: [回踩, 趋势回踩, 缩量回调]
market_regimes: [进攻, 均衡]
priority: 50
instructions: |
  按趋势回踩的标准判断：
  - 判断标准：technical 确认均线多头排列（MA5>MA10>MA20 且向上）；daily_bars 看回踩 MA10/MA20 时成交量明显萎缩
    （量比 < 0.8）；中期涨幅是否过大（已翻倍则谨慎）；chips 看获利盘是否稳定。
  - 入场条件：缩量回踩均线并出现止跌 K 线（长下影、小阴十字）时介入，买点靠近均线，止损位清晰。
  - 出场条件：反弹到前高附近分批止盈；止损：放量跌破 MA20 或跌破回踩低点 -3%。
  - 回避：均线走平或空头、回踩时放量、大盘防守/冰点、公告风险。
  - 对结论的影响：趋势结构完好且缩量才看多；给出具体支撑位和止损价。
