name: dragon_head
display_name: 龙头战法
description: 只做板块或市场的绝对龙头，看辨识度、带动性和市场地位。
category: emotion
aliases: [龙头, 板块龙头, 总龙头]
market_regimes: [进攻, 均衡]
priority: 15
instructions: |
  按龙头战法的标准判断：
  - 龙头特征：theme 中角色为龙头；limit_up_history 显示最早涨停、连板最高或封板最强；同板块股票跟随其涨跌；
    有清晰的题材逻辑和辨识度；成交额大、换手充分。
  - 入场条件：龙头首次分歧后的转强（回封、换手板、缩量回踩不破 MA5/MA10），或题材启动初期的首板/二板；
    fund_flow 主力持续净流入。
  - 出场条件：龙头断板且次日无法修复、跟风股集体补跌、板块转入退潮时离场；止损：跌破分歧日低点或 -6%。
  - 回避：不是龙头的跟风股按龙头标准衡量会得到低分；大盘冰点/防守；已经加速到高位无量能承接。
  - 对结论的影响：是否龙头是硬性前提，不是龙头直接说明并降为观望。
instructions_en: |
  Leadership is mandatory. Check the theme role, earliest or strongest limit-up seals, highest consecutive limit-ups, influence on sector peers, recognizable catalysts and sufficient traded value and turnover.
  Enter a leader strengthening after its first disagreement: reseal, turnover limit-up, or low-volume pullback holding MA5/MA10. Early-theme first/second limit-ups with sustained major inflows are preferable.
  Exit when a broken streak cannot recover the next day, followers fall together or the sector retreats. Stop below the disagreement-day low or at a 6% loss. Avoid followers, frozen/defensive markets and unsupported high-level acceleration. If leadership is absent, explicitly downgrade to watch.
