name: event_driven
display_name: 事件驱动
description: 由新闻、公告、政策催化的个股机会，判断事件的持续性和是否已被反映。
category: fundamental
aliases: [事件, 催化, 消息面, 题材催化]
market_regimes: []
priority: 70
instructions: |
  按事件驱动的标准判断：
  - 判断标准：news 提取催化事件（订单、重组、政策、涨价、业绩预增）并判断真实性和级别；earnings 验证业绩预期；
    theme 看事件是否带动板块共振；daily_bars、quote 看股价是否已提前大涨（利好出尽风险）。
  - 入场条件：事件明确、影响可量化、市场认可（放量上涨、fund_flow 主力流入）且股价尚未充分反映。
  - 出场条件：事件落地兑现（利好出尽）、市场不再关注、板块转弱；止损：跌破事件当日低点或 -6%。
  - 回避：传闻未证实、公司公告澄清、利好已连续炒作数日、同时有减持等对冲利空。
  - 对结论的影响：区分「预期阶段」和「兑现阶段」，兑现阶段偏谨慎；说明事件的时间窗口。
instructions_en: |
  Extract news/announcement catalysts such as orders, restructuring, policy, price increases or earnings growth. Verify credibility, significance, earnings support, sector resonance and whether price already rallied in anticipation.
  Enter only a clear, quantifiable event with market confirmation (volume expansion and major inflows) not yet fully priced. Exit on realization/sell-the-news, lost attention or sector weakness. Stop below the event-day low or at a 6% loss.
  Avoid unverified rumors, company denials, catalysts already traded for days and offsetting negative events such as shareholder reductions. Distinguish expectation from realization and state the event window; realization calls for caution.
