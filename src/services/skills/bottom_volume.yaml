name: bottom_volume
display_name: 底部放量
description: 长期下跌或横盘的低位出现放量，判断主力吸筹与趋势反转。
category: reversal
aliases: [底部, 低位放量, 底部反转]
market_regimes: [均衡, 进攻]
priority: 65
instructions: |
  按底部放量的标准判断：
  - 判断标准：daily_bars 确认股价处于近半年低位区（距高点回撤 40% 以上）且已横盘整理；technical 看量比显著放大
    （≥ 2 倍）并伴随阳线，MACD 底背离更佳；chips 看筹码是否向低位集中、获利盘比例回升；
    fund_flow 主力连续净流入。
  - 入场条件：放量突破底部平台或放量后缩量回踩不破放量 K 线低点时分批介入。
  - 出场条件：上涨到前期密集成交区分批止盈；止损：跌破放量阳线低点或平台下沿 -5%。
  - 回避：放量下跌（出货）、基本面有硬伤（news、earnings 显示业绩大幅亏损或风险公告）、放量后立即回落。
  - 对结论的影响：低位 + 放量阳线 + 主力流入才给偏多；只有放量没有位置优势视为观望。
