name: re_rating
display_name: 预期重估
description: 基本面预期出现变化（业绩拐点、景气反转、政策）带来的估值重估。
category: fundamental
aliases: [重估, 预期差, 估值重估]
market_regimes: []
priority: 75
instructions: |
  按预期重估的标准判断：
  - 判断标准：earnings 看业绩预告/快报是否超预期、增速拐点；news 找景气拐点、涨价、订单、政策类催化；
    quote 看市盈率、市净率相对历史和行业的位置（估值低于合理区间才有重估空间）；
    theme 看是否有板块资金认可。
  - 入场条件：预期刚被验证、股价和估值尚未修复、fund_flow 主力开始净流入、日线（daily_bars）放量突破。
  - 出场条件：估值修复到合理区间、业绩兑现后不及预期、催化事件落地；止损：跌破重估启动位 -7% 左右。
  - 回避：预期已被大幅炒作（股价提前翻倍）、业绩变脸风险、仅有概念无业绩支撑。
  - 对结论的影响：说明「预期差」在哪里、已被市场反映了多少；无法找到明确预期变化时不要硬编，给观望。
instructions_en: |
  Identify earnings surprises, a growth turning point, industry recovery, price increases, orders or policy catalysts. Compare PE/PB with historical and sector valuations only when supplied; require room below reasonable valuation and sector capital recognition.
  Enter newly verified expectations while price/valuation have not repaired, with initial major inflows and a high-volume daily breakout. Exit after valuation repair, disappointing realization or catalyst completion. Stop near 7% below the re-rating launch level.
  Avoid expectations already heavily traded (for example price doubled), earnings reversal risk and unsupported concepts. Explain the expectation gap and how much is priced in. Without a specific change, do not invent one; watch.
