name: growth_quality
display_name: 成长质量
description: 看业绩增速、估值和趋势是否匹配的中期成长股，适合波段持有。
category: fundamental
aliases: [成长, 质量成长, 成长股]
market_regimes: [均衡, 进攻]
priority: 90
instructions: |
  按成长质量的标准判断（偏中期波段，不是超短线）：
  - 判断标准：earnings 看营收/净利润增速是否持续（预告、快报）；quote 中市盈率、市净率相对增速是否匹配
    （PEG 过高说明透支）；news 排查减持、立案、商誉减值等风险；chips 看筹码集中度和获利盘。
  - 趋势配合：technical 确认股价在 MA60 上方、均线向上；fund_flow 中长期主力流入。
  - 入场条件：基本面向好 + 趋势健康，回踩 MA20/MA60 附近分批布局；仓位可分 2~3 批。
  - 出场条件：业绩增速明显放缓、估值明显透支、跌破 MA60；止损：跌破 MA60 或 -10%。
  - 回避：业绩下滑或增长靠一次性收益、高估值且趋势走弱、公告有重大风险。
  - 对结论的影响：基本面和趋势必须同时满足才看多；只有基本面无趋势，给「等待」并说明触发条件。
