# ============================================================
# 股票池配置
# ============================================================

# 黑名单 - 不参与交易的股票
blacklist:
  # 具体股票代码
  codes: []
  # 关键词过滤（名称包含以下关键词的股票不参与交易）
  name_keywords:
    - "ST"
    - "*ST"
    - "退"
  # 上市天数不足此值的不参与
  min_listing_days: 60

# 白名单 - 仅关注的板块（为空则关注全部）
focus_sectors: []

# 市值过滤（单位：亿元）
market_cap:
  min: 20    # 最小市值
  max: 5000  # 最大市值

# 价格过滤（单位：元）
price:
  min: 3.0
  max: 100.0
