# ============================================================
# 股票池配置
# ============================================================

# 黑名单 - 不参与交易的股票
blacklist:
  # 具体股票代码（6位，需加引号，如 "600000"）
  codes: []
  # 关键词过滤（名称包含以下关键词的股票不参与交易）
  name_keywords:
    - "ST"
    - "*ST"
    - "退"
  # 上市天数（自然日）不足此值的不参与；上市日期取自沪深北交易所官方列表，每天自动刷新一次；0 表示不限制
  min_listing_days: 60

# 白名单 - 仅关注的板块（为空则关注全部）
# 按涨停池中的「所属行业」包含匹配，如 "半导体"；板块未知的股票视为不在白名单内
focus_sectors: []

# 市值过滤（单位：亿元）
market_cap:
  min: 20    # 最小市值
  max: 5000  # 最大市值

# 价格过滤（单位：元）
price:
  min: 3.0
  max: 100.0
